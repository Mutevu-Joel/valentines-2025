<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>A Question for You ❤️</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            height: 100vh;
            display: flex;
            flex-direction: column;
            /* Pushes card to bottom so face is visible */
            justify-content: flex-end; 
            align-items: center;
            font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            
            /* BACKGROUND SETTINGS */
            /* Gradient darkens bottom so text is readable */
            background: linear-gradient(to bottom, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.8) 80%), url('first-date.jpg');
            background-size: cover;
            background-position: center top; /* Focuses on faces at top */
            background-repeat: no-repeat;
            color: white;
            overflow: hidden; /* Prevents scrollbars when buttons move */
            padding-bottom: 40px; 
        }

        .card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 2rem;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
            width: 90%;
            max-width: 380px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
            z-index: 100;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 20px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .btn-container {
            margin-top: 20px;
            height: 60px; /* Space for buttons */
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            position: relative;
        }

        button {
            padding: 12px 30px;
            border-radius: 50px;
            border: none;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        #yesBtn {
            background: #ff4d6d;
            color: white;
            z-index: 10;
        }

        #noBtn {
            background: #ffffff;
            color: #ff4d6d;
            position: absolute; /* Allows movement */
            right: 20px; /* Start position */
        }
        
        .countdown {
            margin-top: 20px;
            font-size: 0.85rem;
            opacity: 0.9;
            background: rgba(0,0,0,0.3);
            padding: 5px 10px;
            border-radius: 10px;
            display: inline-block;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1 id="question">Will you be my Valentine? 🌹</h1>
        
        <div class="btn-container">
            <button id="yesBtn">YES</button>
            <button id="noBtn">No</button>
        </div>

        <div class="countdown" id="countdown">
            Loading timer...
        </div>
    </div>

    <script>
        // --- CONFIGURATION: UPDATE THIS! ---
        // Your Phone Number (Country Code + Number). No '+' sign.
        // Example: Kenya is 254... 
        const PHONE_NUMBER = "254798466318"; 

        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const question = document.getElementById('question');
        
        // State for button growth
        let yesScale = 1;

        // 1. Move "No" Button & Grow "Yes" Button
        function moveButton() {
            // Get random position within the screen
            const x = Math.random() * (window.innerWidth - 100);
            const y = Math.random() * (window.innerHeight - 100);

            noBtn.style.position = "fixed"; // Break out of the card layout
            noBtn.style.left = x + "px";
            noBtn.style.top = y + "px";

            // Grow the YES button
            yesScale += 0.4; // Grow by 40% each time
            yesBtn.style.transform = `scale(${yesScale})`;
        }

        // Trigger on hover (desktop) or touch (mobile)
        noBtn.addEventListener('mouseover', moveButton);
        noBtn.addEventListener('touchstart', (e) => {
            e.preventDefault(); // Stop the click from registering
            moveButton();
        });
        noBtn.addEventListener('click', moveButton);

        // 2. "Yes" Button Action
        yesBtn.addEventListener('click', () => {
            // Confetti Explosion
            confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });

            question.innerText = "Yay! I knew you'd say yes! ❤️";
            noBtn.style.display = "none"; // Hide No button
            document.getElementById("countdown").style.display = "none";
            
            // Redirect to WhatsApp after 1.5 seconds
            setTimeout(() => {
                const message = "Hey! I just saw your site and... YES, I will be your Valentine! 🌹🥰";
                const url = `https://wa.me/${PHONE_NUMBER}?text=${encodeURIComponent(message)}`;
                window.location.href = url;
            }, 1500);
        });

        // 3. Countdown Timer
        const vDay = new Date(`February 14, ${new Date().getFullYear()} 00:00:00`).getTime();
        setInterval(() => {
            const now = new Date().getTime();
            const diff = vDay - now;
            if (diff < 0) {
                 document.getElementById("countdown").innerText = "Happy Valentine's Day!"; 
                 return;
            }
            const d = Math.floor(diff / (1000 * 60 * 60 * 24));
            const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            document.getElementById("countdown").innerText = `${d}d ${h}h ${m}m until Valentine's`;
        }, 1000);
    </script>
</body>
</html>
