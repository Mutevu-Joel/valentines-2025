<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>A Question for You ❤️</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root { --primary: #ff4d6d; --glass: rgba(255, 255, 255, 0.15); }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, system-ui, sans-serif;
            /* IMAGE: Ensure first-date.jpg is in the folder */
            background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('first-date.jpg');
            background-size: cover;
            background-position: center;
            color: white;
            overflow: hidden;
        }

        .card {
            background: var(--glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 2rem;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
            width: 85%;
            max-width: 350px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
        }

        h1 { font-size: 1.8rem; margin-bottom: 20px; line-height: 1.3; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }

        /* The Button Trick */
        .btn-group { position: relative; height: 60px; width: 100%; margin: 20px 0; }
        
        button {
            width: 100%; height: 100%;
            border-radius: 50px; border: none;
            font-size: 1.2rem; font-weight: bold;
            cursor: pointer;
        }

        #yesBtn {
            background: var(--primary); color: white;
            z-index: 10; position: relative; /* Top Layer */
            box-shadow: 0 4px 15px rgba(255, 77, 109, 0.5);
        }

        #noBtn {
            background: #495057; color: #adb5bd;
            position: absolute; top: 0; left: 0;
            z-index: 1; /* Bottom Layer */
        }

        .countdown {
            margin-top: 20px; font-size: 0.9rem;
            background: rgba(0,0,0,0.3); padding: 10px;
            border-radius: 12px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1 id="mainText">Will you be my Valentine? ❤️</h1>
        <div class="btn-group">
            <button id="noBtn">No</button>
            <button id="yesBtn">YES!</button>
        </div>
        <div class="countdown" id="cnt">
            Time until Valentine's:<br><strong id="timer">...</strong>
        </div>
    </div>

    <script>
        // Countdown
        const vDay = new Date(`February 14, ${new Date().getFullYear()} 00:00:00`).getTime();
        setInterval(() => {
            const now = new Date().getTime();
            const diff = vDay - now;
            if (diff < 0) {
                document.getElementById("cnt").innerText = "Happy Valentine's Day! 🌹"; 
                return;
            }
            const d = Math.floor(diff / (1000 * 60 * 60 * 24));
            const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            document.getElementById("timer").innerText = `${d}d ${h}h ${m}m`;
        }, 1000);

        // Interaction
        const yesBtn = document.getElementById('yesBtn');
        yesBtn.addEventListener('click', async () => {
            confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
            document.getElementById("mainText").innerHTML = "Yay! See you then! 🥰";
            document.getElementById("cnt").style.display = "none";
            yesBtn.innerText = "Sent! 💌";
            
            await fetch('/.netlify/functions/send-sms', { method: 'POST' });
        });
    </script>
</body>
</html>
